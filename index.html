<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>JAYC´sTasks</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6fb;color:#182033}body.dark{background:#111522;color:#eef2ff}.app{max-width:1100px;margin:auto;padding:24px 18px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{margin:0;font-size:32px}.sub,.small{opacity:.65}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 8px 28px #1d2a4a12}body.dark .card{background:#191e2c;box-shadow:none}button{border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;background:#e5e9f4;color:inherit}body.dark button{background:#2a3042}.primary{background:#5b67f1;color:#fff}form{display:grid;gap:9px}input,textarea,select{width:100%;border:1px solid #d9deea;border-radius:11px;padding:11px;font:inherit;background:transparent;color:inherit}body.dark input,body.dark textarea,body.dark select{border-color:#394157}textarea{resize:vertical;min-height:70px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button.active{background:#5b67f1;color:#fff}.item,.grade{padding:12px 0;border-bottom:1px solid #e7eaf1}.item:last-child,.grade:last-child{border:0}.item.done .title{text-decoration:line-through;opacity:.45}.row{display:flex;align-items:center;gap:10px}.title{font-weight:700;flex:1}.meta{font-size:13px;opacity:.65;margin-top:4px}.danger{padding:7px 10px}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.month{font-weight:800;font-size:20px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;font-size:12px;opacity:.6;padding:5px}.day{min-height:78px;border:1px solid #e3e6ee;border-radius:10px;padding:7px;cursor:pointer}.dark .day{border-color:#343b4e}.day.muted{opacity:.35}.day.selected{outline:2px solid #5b67f1}.day.today{background:#eef0ff}.dark .day.today{background:#232843}.num{font-weight:800;font-size:13px}.dot{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.taskdot{color:#5b67f1}.examdot{color:#e55b5b}.progress{height:11px;background:#e8ebf3;border-radius:99px;overflow:hidden;margin-top:8px}.bar{height:100%;width:0;background:#5b67f1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.statbox{display:flex;flex-direction:column;padding:12px 14px;border-radius:14px;background:#eef0ff;margin-bottom:8px}.dark .statbox{background:#232843}.statbox strong{font-size:24px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.chip{padding:7px 10px;border-radius:999px;background:#eef0ff;font-size:13px}.dark .chip{background:#242b3e}.focus{text-align:center}.time{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums}@media(max-width:800px){.grid,.grid2{grid-template-columns:1fr}.day{min-height:65px}}
</style></head><body><div class="app">
<header><div><h1>🚀 JAYC´sTasks</h1><div class="sub">Tus tareas, exámenes, notas y estadísticas.</div></div><button id="theme">🌙</button></header>
<div class="grid"><section class="card"><h2>➕ Añadir</h2><div class="tabs"><button class="active" id="tabTask">📝 Tarea</button><button id="tabExam">🧪 Examen</button></div><form id="form"><input id="subject" placeholder="Asignatura" required><input id="title" placeholder="Qué tienes que hacer" required><input id="date" type="date" required><input id="timeInput" type="time"><textarea id="notes" placeholder="Detalles (opcional)"></textarea><button class="primary">Añadir</button></form></section>
<section class="card"><div class="calendar-head"><button id="prev">‹</button><div class="month" id="month"></div><button id="next">›</button></div><div class="week"><div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div></div><div class="days" id="days"></div><div class="small" id="selectedInfo"></div></section></div>
<section class="card"><h2 id="listTitle">📌 Próximas cosas</h2><div id="list"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="small" id="stats"></div></section>
<section class="card"><h2>📊 Mis notas y estadísticas</h2><div class="grid2"><form id="gradeForm"><input id="gradeSubject" placeholder="Asignatura" required><select id="gradeType"><option>Examen</option><option>Trabajo</option><option>Tarea</option><option>Otro</option></select><input id="gradeValue" type="number" min="0" step=".01" placeholder="Nota" required><input id="gradeMax" type="number" min="1" step=".01" value="10" placeholder="Sobre" required><input id="gradeDate" type="date" required><input id="gradeComment" placeholder="Comentario (opcional)"><button class="primary">➕ Guardar nota</button></form><div><div class="statbox"><strong id="avg">—</strong><span>Media general</span></div><div class="statbox"><strong id="best">—</strong><span>Mejor nota</span></div><div class="statbox"><strong id="worst">—</strong><span>Nota más baja</span></div></div></div><div id="subjectStats"></div><div id="grades"></div></section>
<section class="card focus"><h2>🧠 Modo concentración</h2><div class="small">25 minutos</div><div class="time" id="time">25:00</div><button class="primary" id="start">▶ Empezar</button><button id="reset">↻ Reiniciar</button></section>
</div>
<script>
const $=x=>document.getElementById(x),KEY="jayc_tasks",GKEY="jayc_grades";let items=JSON.parse(localStorage.getItem(KEY)||"[]"),grades=JSON.parse(localStorage.getItem(GKEY)||"[]"),type="task",view=new Date(),selected=new Date(),seconds=1500,interval=null;selected.setHours(0,0,0,0);
const iso=d=>d.toISOString().slice(0,10),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(items));renderCalendar();renderList()}function setType(t){type=t;$("tabTask").classList.toggle("active",t==="task");$("tabExam").classList.toggle("active",t==="exam");$("title").placeholder=t==="task"?"Qué tienes que hacer":"Nombre del examen"}
$("tabTask").onclick=()=>setType("task");$("tabExam").onclick=()=>setType("exam");
$("form").onsubmit=e=>{e.preventDefault();items.push({id:Date.now(),type,subject:$("subject").value.trim(),title:$("title").value.trim(),date:$("date").value,time:$("timeInput").value,notes:$("notes").value.trim(),done:false});$("form").reset();save()};
function renderCalendar(){let y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,total=new Date(y,m+1,0).getDate();$("month").textContent=view.toLocaleDateString("es-ES",{month:"long",year:"numeric"});let h="";for(let i=0;i<42;i++){let n=i-start+1,d=new Date(y,m,n),k=iso(d),a=items.filter(x=>x.date===k);h+=`<div class="day ${n<1||n>total?"muted ":""}${k===iso(selected)?"selected ":""}${k===iso(new Date())?"today":""}" data-date="${k}"><div class="num">${d.getDate()}</div>${a.slice(0,3).map(x=>`<div class="dot ${x.type==="exam"?"examdot":"taskdot"}">${x.type==="exam"?"🧪":"📝"} ${esc(x.title)}</div>`).join("")}${a.length>3?`<div class="dot">+${a.length-3} más</div>`:""}</div>`}$("days").innerHTML=h;document.querySelectorAll(".day").forEach(e=>e.onclick=()=>{selected=new Date(e.dataset.date+"T00:00:00");renderCalendar();renderList()});let c=items.filter(x=>x.date===iso(selected)).length;$("selectedInfo").textContent=`${selected.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}: ${c?c+" elemento"+(c===1?"":"s"):"nada programado"}.`}
function renderList(){let a=items.filter(x=>x.date===iso(selected)).sort((x,y)=>(x.time||"").localeCompare(y.time||""));$("listTitle").textContent="📌 "+selected.toLocaleDateString("es-ES",{day:"numeric",month:"long"});$("list").innerHTML=a.length?a.map(x=>`<div class="item ${x.done?"done":""}"><div class="row"><input type="checkbox" ${x.done?"checked":""} onchange="toggle(${x.id})"><span class="title">${x.type==="exam"?"🧪":"📝"} ${esc(x.subject)} — ${esc(x.title)}</span><button class="danger" onclick="removeItem(${x.id})">🗑️</button></div><div class="meta">${x.time?x.time+" · ":""}${x.type==="exam"?"Examen":"Tarea"}${x.notes?" · "+esc(x.notes):""}</div></div>`).join(""):'<div class="small">No hay tareas ni exámenes este día.</div>';let done=items.filter(x=>x.done).length,p=items.length?Math.round(done/items.length*100):0;$("bar").style.width=p+"%";$("stats").textContent=`${done}/${items.length} completadas · ${p}%`}
function toggle(id){let x=items.find(a=>a.id===id);x.done=!x.done;save()}function removeItem(id){items=items.filter(x=>x.id!==id);save()}$("prev").onclick=()=>{view.setMonth(view.getMonth()-1);renderCalendar()};$("next").onclick=()=>{view.setMonth(view.getMonth()+1);renderCalendar()};
$("gradeDate").value=iso(new Date());$("gradeForm").onsubmit=e=>{e.preventDefault();grades.push({id:Date.now(),subject:$("gradeSubject").value.trim(),type:$("gradeType").value,value:+$("gradeValue").value,max:+$("gradeMax").value,date:$("gradeDate").value,comment:$("gradeComment").value.trim()});localStorage.setItem(GKEY,JSON.stringify(grades));$("gradeForm").reset();$("gradeMax").value=10;$("gradeDate").value=iso(new Date());renderGrades()};
function renderGrades(){if(!grades.length){$("avg").textContent=$("best").textContent=$("worst").textContent="—";$("subjectStats").innerHTML='<div class="small">Añade tu primera nota para ver tus estadísticas. ✨</div>';$("grades").innerHTML="";return}let n=grades.map(g=>g.value/g.max*10),mean=n.reduce((a,b)=>a+b,0)/n.length;$("avg").textContent=mean.toFixed(2)+"/10";$("best").textContent=Math.max(...n).toFixed(2)+"/10";$("worst").textContent=Math.min(...n).toFixed(2)+"/10";let by={};grades.forEach(g=>(by[g.subject]??=[]).push(g.value/g.max*10));$("subjectStats").innerHTML='<div class="chips">'+Object.entries(by).map(([s,v])=>`<span class="chip">📚 ${esc(s)}: <b>${(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2)}</b>/10</span>`).join("")+"</div>";$("grades").innerHTML=grades.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(g=>`<div class="grade"><div class="row"><span class="title">${esc(g.subject)} · ${esc(g.type)}</span><strong>${g.value}/${g.max}</strong><button class="danger" onclick="removeGrade(${g.id})">🗑️</button></div><div class="meta">${g.date} · Equiv. ${(g.value/g.max*10).toFixed(2)}/10${g.comment?" · "+esc(g.comment):""}</div></div>`).join("")}
function removeGrade(id){grades=grades.filter(g=>g.id!==id);localStorage.setItem(GKEY,JSON.stringify(grades));renderGrades()}
function updateTimer(){let m=Math.floor(seconds/60),s=seconds%60;$("time").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
$("start").onclick=()=>{if(interval){clearInterval(interval);interval=null;$("start").textContent="▶ Continuar";return}$("start").textContent="⏸ Pausar";interval=setInterval(()=>{if(seconds){seconds--;updateTimer()}else{clearInterval(interval);interval=null;$("start").textContent="▶ Empezar";alert("🎉 ¡Sesión terminada!")}},1000)};$("reset").onclick=()=>{clearInterval(interval);interval=null;seconds=1500;updateTimer();$("start").textContent="▶ Empezar"};$("theme").onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("jayc_dark",document.body.classList.contains("dark"));$("theme").textContent=document.body.classList.contains("dark")?"☀️":"🌙"};if(localStorage.getItem("jayc_dark")==="true"){document.body.classList.add("dark");$("theme").textContent="☀️"}$("date").value=iso(selected);setType("task");renderCalendar();renderList();renderGrades();updateTimer();
</script></body></html>
